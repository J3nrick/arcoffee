  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">

  <style>
    :root {
      --brand-blue: #0F2537;
      --brand-orange: #FF6600;
      --brand-cream: #FAF7F2;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--brand-cream);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: var(--brand-cream);
      color: var(--brand-blue);
      transition: opacity 0.4s ease;
    }
    .brand-mark {
      width: 68px;
      height: 68px;
      background: var(--brand-blue);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-cream);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1.5px;
      box-shadow: 0 12px 30px rgba(15, 37, 55, 0.18);
      position: relative;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      top: -4px;
      right: -4px;
      width: 14px;
      height: 14px;
      background: var(--brand-orange);
      border-radius: 50%;
      border: 2.5px solid var(--brand-cream);
    }
    .spinner {
      margin-top: 28px;
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(15, 37, 55, 0.1);
      border-radius: 50%;
      border-top-color: var(--brand-orange);
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .logo-text {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--brand-blue);
    }
    .slogan-text {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-orange);
      letter-spacing: 0.2px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand-mark">ar</div>
    <div class="spinner"></div>
    <div class="logo-text">ARCOFFEE</div>
    <div class="slogan-text">"It's always been ours."</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
