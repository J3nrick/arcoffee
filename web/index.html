  <style>
    :root {
      --brand-blue: #0B1B2B;
      --brand-orange: #F36622;

    * {
      box-sizing: border-box;

      -webkit-user-select: none;

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--brand-cream);
      color: var(--brand-blue);
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      cursor: default;
    }
    #loading.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .brand-logo-img {
      height: 56px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
    }

<body>
  <div id="loading">
    <img src="logo.png" alt="ARCOFFEE Logo" class="brand-logo-img" />
  </div>

  <script>
    (function () {
      var startTime = Date.now();
      var isDismissed = false;
      var MAX_SPLASH_TIME = 6000; // Safety fallback timeout

      function dismissSplash() {
        if (isDismissed) return;
        isDismissed = true;

        var loader = document.getElementById('loading');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(function () {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 500);
        }
      }

      // Allow user to tap/click to dismiss immediately if eager
      var loaderEl = document.getElementById('loading');
      if (loaderEl) {
        loaderEl.addEventListener('click', dismissSplash);
      }

      // 1. Listen for Flutter engine first-frame paint -> immediately reveal Flutter SplashScreen
      window.addEventListener('flutter-first-frame', function () {
        dismissSplash();
      });

      // 2. Fallback DOM observer in case flutter-first-frame already fired
      var observer = new MutationObserver(function (mutations, obs) {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          try { obs.disconnect(); } catch (e) {}
          dismissSplash();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 3. Strict 3-second hard timeout: splash screen will NEVER stay longer than 3 seconds
      setTimeout(function () {
        dismissSplash();
        try { observer.disconnect(); } catch (e) {}
      }, MAX_SPLASH_TIME);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
